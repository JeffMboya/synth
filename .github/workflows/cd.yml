name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  bin:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              label: linux-amd64,
              ext: "",
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              label: linux-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              label: darwin-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: x86_64-apple-darwin,
              label: darwin-amd64,
              ext: "",
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              label: windows-amd64,
              ext: ".exe",
            }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/synth${{ matrix.ext }}"
          asset="synth-${{ matrix.label }}${{ matrix.ext }}"
          cp "$src" "dist/$asset"
          ( cd dist && sha256sum "$asset" > "$asset.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [bin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version=$(awk '
              /^\[workspace\.package\]/ { in_section=1; next }
              /^\[/ { in_section=0 }
              in_section && /^version[[:space:]]*=/ {
                gsub(/.*=[[:space:]]*"/, "")
                gsub(/".*/, "")
                print
                exit
              }
            ' Cargo.toml)
            if [ -z "${version}" ]; then
              echo "::error::Could not read [workspace.package].version from Cargo.toml"
              exit 1
            fi
            if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::Cargo.toml version '${version}' is not semver (expected X.Y.Z)"
              exit 1
            fi
            tag="v${version}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "tag_exists=${exists}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag ${tag} (exists=${exists})"

      - name: Create and push tag if missing
        id: tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "chore: release version ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created tag ${TAG}"

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          # Release when the run is on a tag, or when this run just created it
          # from a version bump on main.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ steps.tag.outputs.created }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping release."
          fi

      - name: Download all artifacts
        if: steps.decide.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/**
          generate_release_notes: true
          body: |
            ## Install

            Download the archive for your platform, verify its checksum, and put `synth` on your `PATH`:

            ```bash
            sha256sum -c synth-linux-amd64.sha256
            chmod +x synth-linux-amd64
            ./synth-linux-amd64 --help
            ```

            Available builds: `linux-amd64`, `linux-arm64`, `darwin-amd64`, `darwin-arm64`, `windows-amd64`.

            ## From source

            ```bash
            cargo install --git https://github.com/absmach/synth --tag ${{ steps.version.outputs.tag }} synth-cli
            ```

            ## Optional: KiCad integration

            Electrical-rule checks, schematic rendering, and fabrication outputs shell out to `kicad-cli`. Install KiCad 10 to enable them. Without it, `synth export-kicad` still generates a project, but every native check reports `unknown` rather than passing, and any command that asked for verification (`--validate-erc`, `--gerbers`/`--drill`/`--step`, `synth check --fab`) fails closed. Set `KICAD_CLI` if the binary is not on `PATH`.

            See the [README](https://github.com/absmach/synth) for the language, the MCP server, and the review workflow.
