id = "tmp117_temperature"
kind = "sensor"
description = "TI TMP117 high-accuracy temperature sensor, I²C"
kicad_symbol = "Sensor_Temperature:TMP117xxDRV"
kicad_footprint = "Package_SON:WSON-6-1EP_2x2mm_P0.65mm_EP1x1.6mm"

[footprint_dimensions]
width_mm = 2.0
height_mm = 2.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vdd"
number = "5"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "6"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "1"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

# `Package_SON:WSON-6-1EP_2x2mm_P0.65mm_EP1x1.6mm` has six signal pads and an
# exposed pad; pads 3 and 4 were the two with no pin to own them. Names and
# types come from the stock symbol `Sensor_Temperature:TMP117xxDRV`, which
# extends `TMP102xxDRL`. The four pads the part already declared were on the
# right pins.
[[pins]]
name = "alert"
number = "3"
electrical_type = "open_drain_low"

[[pins]]
name = "add0"
number = "4"
electrical_type = "input"

# Pad 7 is the exposed thermal pad, and it is deliberately absent from this
# map. `Sensor_Temperature:TMP117xxDRV` declares six pins, so a seventh here
# would be a pin the schematic cannot reach — the strict registry load rejects
# it outright. TI's datasheet allows the pad to float, which is what an
# undeclared pad gets.

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

