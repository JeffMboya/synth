id = "24lc256_eeprom"
kind = "memory"
description = "Microchip 24LC256 32KB I²C EEPROM"
mpn = "24LC256-I/SN"
lcsc_pn = "C7611"
kicad_symbol = "Memory_EEPROM:24LC256"
kicad_footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

[footprint_dimensions]
width_mm = 6.9
height_mm = 4.41
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 3.6
max_current_ma = 50.0

[[pins]]
name = "vdd"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "3"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "4"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

# The rest of the SOIC-8's pads. Names and numbers come from the stock
# symbol `Memory_EEPROM:24LC256`, which extends `24LC16`.
# A0-A2 set the device address and WP is the write-protect input; both
# have to be tied somewhere on a real board, but that is the board's
# job, so neither is marked `required` here.

[[pins]]
name = "sda_2"
number = "5"
electrical_type = "bidirectional"

[[pins]]
name = "scl_2"
number = "6"
electrical_type = "input"

[[pins]]
name = "wp"
number = "7"
electrical_type = "input"

[[pins]]
name = "vcc"
number = "8"
electrical_type = "power_input"

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

