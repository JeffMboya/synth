schema_version = 2

# A complete floorplan, authored because the placer cannot produce one.
#
# `synth place` refuses this board with E-SYNTH-PLACE-002 on whichever
# passive it reaches last. That is a documented limitation rather than a
# property of the design -- the diagnostic's own notes say the placer is
# "greedy first-fit; it commits to each placement and never un-commits",
# and that backtracking is future work. It placed the same board at 119
# components and fails at 127, with roughly 9000 mm2 of courtyard on a
# board it sizes near 156 mm square, so area was never the problem.
#
# So the floorplan is the design's, and it is better than an automatic one
# would have been. The board reads left to right as it works: 12 V entry
# down the left edge, the two switching stages above it with each inductor
# beside its own regulator, the module in the middle, storage above it, the
# USB programming path on the bottom edge, Ethernet to the right with the
# jack on the board edge, and the expansion silicon under the headers.
# Both switching loops are deliberate; an automatic placement had put one
# inductor across the board from its regulator.
#
# Coordinates are courtyard centres in board millimetres. Generated by
# seeding each passive at the centroid of the anchors it is wired to and
# taking the nearest free cell, then checked for overlap against every
# courtyard already placed.

