# Hand floorplan for the Class-C compute and memory platform.
#
# The fabric is in the middle with a die either side, so each data group
# faces the bank it comes from; the damping sits in two columns between
# them; the two switchers and the input run along the top; the USB bridge
# takes the left edge under its connector; and the expansion and debug
# headers take the right.
#
# Positions are courtyard centres, which is what the sidecar's x/y is
# applied as — for a part whose footprint origin is not its centre (pad 1
# of a header) the two differ.

