schema_version = "synth.qualification.v1"

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "hello"
path = "fixtures/designs/hello.synth"
class = "A"
status = "qualified"
expect = "pass"
rationale = "Smallest valid board declaration. Proves the release command itself is sound."

[[board]]
id = "env_logger"
path = "examples/env_logger.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "USB-C power, LDO, MCU, I2C sensor, debug header. The Class-A envelope in #39."

[[board]]
id = "sensor_logger"
path = "examples/sensor_logger.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Dual I2C sensors, SPI flash, status LEDs. Larger Class-A digital board."

[[board]]
id = "placement_and_diff_pair"
path = "examples/placement_and_diff_pair.synth"
class = "C"
status = "experimental"
expect = "pass"
rationale = "Differential-pair constraints, placement hints, keepouts. Class-C constraint surface per #40."

[[board]]
id = "ref_ldo_sensor"
path = "fixtures/kicad-reference/ref_ldo_sensor.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Generic passives carry no `value`, so the BOM would not be orderable."

[[board]]
id = "ref_crystal_mcu"
path = "fixtures/kicad-reference/ref_crystal_mcu.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Same unvalued-passive defect on a crystal/MCU board."

[[board]]
id = "ref_usb_cdc"
path = "fixtures/kicad-reference/ref_usb_cdc.synth"
class = "B"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. USB-class interface; unvalued passives block it today."

[[board]]
id = "secure_tracker"
path = "fixtures/kicad-reference/secure_tracker.synth"
class = "D"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Most complex reference board; stands in for the Class-D envelope in #41."

[[board]]
id = "a1_rp2350_debug_target"
path = "qualification/boards/class-a/a1_rp2350_debug_target.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: RP2350 with SWD header, crystal, reset, boot flash and status LED. #39 case 1."

[[board]]
id = "a2_i2c_sensor_node"
path = "qualification/boards/class-a/a2_i2c_sensor_node.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: regulated I2C sensor node with pull-ups, EEPROM and a protected breakout. #39 case 2."

[[board]]
id = "a3_protected_power_entry"
path = "qualification/boards/class-a/a3_protected_power_entry.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: reverse-polarity P-FET, polyfuse, TVS, buck, soft-start load switch. #39 case 3."

[[board]]
id = "a4_negative_broken_mcu_board"
path = "qualification/boards/class-a/a4_negative_broken_mcu_board.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-CONNECT-001", "E-SYNTH-NAME-001", "E-SYNTH-VALUE-001"]
rationale = "Novel Class-A negative: floating required pins, a duplicated reference and an unvalued passive. #39 negative case."

[[board]]
id = "b1_buck_regulator_module"
path = "qualification/boards/class-b/b1_buck_regulator_module.synth"
class = "B"
status = "experimental"
expect = "pass"
rationale = "Novel Class-B board: 12V-to-3V3 buck with pi filtering both sides, output-sensed feedback and a discrete power-good. #38 case 1."

[[board]]
id = "b2_precision_analog_frontend"
path = "qualification/boards/class-b/b2_precision_analog_frontend.synth"
class = "B"
status = "experimental"
expect = "pass"
rationale = "Novel Class-B board: differential gain stage, buffered mid-rail bias, analog keepout and netclass, SPI bus to the MCU. #38 case 2."

[[board]]
id = "b3_usb_peripheral"
path = "qualification/boards/class-b/b3_usb_peripheral.synth"
class = "B"
status = "experimental"
expect = "pass"
rationale = "Novel Class-B board: USB-C with CC pull-downs, ESD clamps at the connector, a declared 90 ohm pair into native USB pins. #38 case 3."

[[board]]
id = "b4_negative_unsafe_mixed_signal"
path = "qualification/boards/class-b/b4_negative_unsafe_mixed_signal.synth"
class = "B"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-STACKUP-001", "E-SYNTH-USB-001", "E-SYNTH-POWER-011"]
rationale = "Novel Class-B negative: stackup contradicting the layer count, USB pair on plain GPIO, and buck feedback taken from the switch node. #38 negative case."

[[board]]
id = "c1_dual_usb_compute"
path = "qualification/boards/class-c/c1_dual_usb_compute.synth"
class = "C"
status = "experimental"
expect = "pass"
rationale = "Novel Class-C board: six-layer stackup, two independent 90 ohm USB pairs, QSPI at speed, 61-pin MCU and a 20-pin header. #40 constraint surface, minus the length/skew budgets the language cannot express."

[[board]]
id = "c2_usb_uart_bridge_4layer"
path = "qualification/boards/class-c/c2_usb_uart_bridge_4layer.synth"
class = "C"
status = "experimental"
expect = "pass"
rationale = "Novel Class-C board: impedance-controlled 4-layer stackup, CH340G USB pair at 90 ohm with clamps at the connector, crystal and activity indicators. #40 constraint preservation."
