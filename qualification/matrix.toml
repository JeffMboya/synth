schema_version = "synth.qualification.v1"

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "hello"
path = "fixtures/designs/hello.synth"
class = "A"
status = "qualified"
expect = "pass"
rationale = "Smallest valid board declaration. Proves the release command itself is sound."

[[board]]
id = "env_logger"
path = "examples/env_logger.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "USB-C power, LDO, MCU, I2C sensor, debug header. The Class-A envelope in #39."

[[board]]
id = "sensor_logger"
path = "examples/sensor_logger.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Dual I2C sensors, SPI flash, status LEDs. Larger Class-A digital board."

[[board]]
id = "placement_and_diff_pair"
path = "examples/placement_and_diff_pair.synth"
class = "C"
status = "experimental"
expect = "pass"
rationale = "Differential-pair constraints, placement hints, keepouts. Class-C constraint surface per #40."

[[board]]
id = "ref_ldo_sensor"
path = "fixtures/kicad-reference/ref_ldo_sensor.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Generic passives carry no `value`, so the BOM would not be orderable."

[[board]]
id = "ref_crystal_mcu"
path = "fixtures/kicad-reference/ref_crystal_mcu.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Same unvalued-passive defect on a crystal/MCU board."

[[board]]
id = "ref_usb_cdc"
path = "fixtures/kicad-reference/ref_usb_cdc.synth"
class = "B"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. USB-class interface; unvalued passives block it today."

[[board]]
id = "secure_tracker"
path = "fixtures/kicad-reference/secure_tracker.synth"
class = "D"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-VALUE-001"]
rationale = "Negative test. Most complex reference board; stands in for the Class-D envelope in #41."

[[board]]
id = "a1_rp2350_debug_target"
path = "qualification/boards/class-a/a1_rp2350_debug_target.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: RP2350 with SWD header, crystal, reset, boot flash and status LED. #39 case 1."

[[board]]
id = "a2_i2c_sensor_node"
path = "qualification/boards/class-a/a2_i2c_sensor_node.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: regulated I2C sensor node with pull-ups, EEPROM and a protected breakout. #39 case 2."

[[board]]
id = "a3_protected_power_entry"
path = "qualification/boards/class-a/a3_protected_power_entry.synth"
class = "A"
status = "experimental"
expect = "pass"
rationale = "Novel Class-A board: reverse-polarity P-FET, polyfuse, TVS, buck, soft-start load switch. #39 case 3."

[[board]]
id = "a4_negative_broken_mcu_board"
path = "qualification/boards/class-a/a4_negative_broken_mcu_board.synth"
class = "A"
status = "unsupported"
expect = "fail"
expect_source_codes = ["E-SYNTH-CONNECT-001", "E-SYNTH-NAME-001", "E-SYNTH-VALUE-001"]
rationale = "Novel Class-A negative: floating required pins, a duplicated reference and an unvalued passive. #39 negative case."
